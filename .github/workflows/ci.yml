name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Protects the web app and shared domain package: typecheck, unit tests, build, and fresh shared fixtures.
  web:
    runs-on: ubuntu-latest
    env:
      NODE_DISABLE_COMPILE_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate fixtures and fail if stale
        run: |
          pnpm fixtures
          git diff --exit-code contracts/fixtures/arithmetic.json
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @tanaad/web build

  # Protects the Laravel API: code style, static analysis, and the Pest suite against real Postgres and Redis.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tanaad
          POSTGRES_PASSWORD: tanaad
          POSTGRES_DB: tanaad_test
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U tanaad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6390:6379
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, sodium
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: ./vendor/bin/pest --ci

  # Protects the API contract (contracts/openapi.yaml) from drifting away from the code.
  # Non-blocking for now: becomes blocking in Phase 1 once oasdiff and openapi-typescript
  # are wired (see docs/plans/BACKEND_DELIVERY_PLAN.md task P0-11).
  contract:
    runs-on: ubuntu-latest
    needs: api
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, sodium
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install dependencies
        working-directory: apps/api
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
      - name: Export OpenAPI
        working-directory: apps/api
        run: php artisan scramble:export --path=../../contracts/openapi.yaml || echo "scramble export not wired yet"
      - name: Check for drift
        run: git diff --exit-code contracts/openapi.yaml || echo "openapi.yaml changed"
