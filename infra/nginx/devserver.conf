# Dev server: the built web app and the API on one origin (plain HTTP on the dev host).
server {
    listen 80;
    server_name _;
    client_max_body_size 40M;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # API and health: php-fpm via the front controller.
    location ~ ^/(api/|up$) {
        root /var/www/api/public;
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120;
    }

    # The queue dashboard is not exposed on this host.
    location /horizon { return 404; }

    location /sw.js { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location /assets/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { root /usr/share/nginx/html; index index.html; try_files $uri $uri/ /index.html; }
}
