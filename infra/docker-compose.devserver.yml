# Dev server stack: one published port (8083, plain HTTP, no domain). Serves the built web app and the API from the
# same origin, so there is no CORS. Everything else stays on the internal network.
#   Secrets: infra/devserver/*.env (gitignored; copy the .example files).
#   Deploy:  infra/scripts/deploy-devserver.sh
name: tanaad-dev

x-php: &php
  build:
    context: ..
    dockerfile: infra/php/Dockerfile
  restart: unless-stopped
  env_file:
    - ./devserver/api.env
  volumes:
    - ../apps/api:/var/www/api
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ../apps/api/public:/var/www/api/public:ro
      - ./nginx/devserver.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *php
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    <<: *php
    command: php artisan horizon
    user: "82:82"
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    <<: *php
    command: php artisan schedule:work
    user: "82:82"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    env_file:
      - ./devserver/db.env
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql:
  redis:
