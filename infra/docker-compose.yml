name: tanaad

x-php: &php
  build:
    context: ..
    dockerfile: infra/php/Dockerfile
  volumes:
    - ../apps/api:/var/www/api
  env_file:
    - ../apps/api/.env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    AWS_ENDPOINT: http://minio:9000
    MAIL_HOST: mailpit
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  api:
    <<: *php
    container_name: tanaad-api

  nginx:
    image: nginx:1.29-alpine
    container_name: tanaad-nginx
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ../apps/api/public:/var/www/api/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  horizon:
    <<: *php
    container_name: tanaad-horizon
    command: php artisan horizon

  scheduler:
    <<: *php
    container_name: tanaad-scheduler
    command: php artisan schedule:work

  postgres:
    image: postgres:18-alpine
    container_name: tanaad-postgres
    ports:
      - "${DB_PORT:-5440}:5432"
    environment:
      POSTGRES_USER: tanaad
      POSTGRES_PASSWORD: tanaad
      POSTGRES_DB: tanaad
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanaad -d tanaad"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tanaad-redis
    ports:
      - "${REDIS_PORT:-6390}:6379"
    volumes:
      - redis:/data

  minio:
    image: minio/minio:latest
    container_name: tanaad-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: tanaad
      MINIO_ROOT_PASSWORD: tanaad-minio
    volumes:
      - minio:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: tanaad-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres:
  redis:
  minio:
