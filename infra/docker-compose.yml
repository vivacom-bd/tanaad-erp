name: tanaad

x-php: &php
  build:
    context: ..
    dockerfile: infra/php/Dockerfile
  volumes:
    - ../apps/api:/var/www/api
  env_file:
    - ../apps/api/.env
  environment:
    DB_HOST: mysql
    REDIS_HOST: redis
    AWS_ENDPOINT: http://minio:9000
    MAIL_HOST: mailpit
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  api:
    <<: *php
    container_name: tanaad-api

  nginx:
    image: nginx:1.29-alpine
    container_name: tanaad-nginx
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ../apps/api/public:/var/www/api/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  horizon:
    <<: *php
    container_name: tanaad-horizon
    command: php artisan horizon

  scheduler:
    <<: *php
    container_name: tanaad-scheduler
    command: php artisan schedule:work

  mysql:
    image: mysql:8.4
    container_name: tanaad-mysql
    # Triggers (the append-only ledger guard) need this when binary logging is on.
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "${DB_PORT:-3340}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: tanaad
      MYSQL_PASSWORD: tanaad
      MYSQL_DATABASE: tanaad
    volumes:
      - mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tanaad-redis
    ports:
      - "${REDIS_PORT:-6390}:6379"
    volumes:
      - redis:/data

  minio:
    image: minio/minio:latest
    container_name: tanaad-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: tanaad
      MINIO_ROOT_PASSWORD: tanaad-minio
    volumes:
      - minio:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: tanaad-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql:
  redis:
  minio:
