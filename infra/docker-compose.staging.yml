# Staging stack. Not started by `make up`. Secrets live in infra/staging/*.env (copy the .example files);
# Caddy gets its own caddy.env with no secrets.
#   docker compose -f infra/docker-compose.staging.yml --env-file infra/staging/staging.env up -d --build
# Only Caddy publishes ports (80/443). MySQL, Redis and MinIO are reachable on the internal network only.
name: tanaad-staging

x-php: &php
  build:
    context: ..
    dockerfile: infra/php/Dockerfile
  restart: unless-stopped
  env_file:
    - ./staging/api.env
  volumes:
    - ../apps/api:/var/www/api
    - api-storage:/var/www/api/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ./staging/caddy.env   # TANAAD_DOMAIN, ACME_EMAIL, MEDIA_ORIGIN only: no secrets reach Caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/dist:/srv/web:ro
      - caddy-data:/data        # certificates: keep this volume or ACME rate limits bite
      - caddy-config:/config
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ../apps/api/public:/var/www/api/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    <<: *php
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    <<: *php
    command: php artisan horizon
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    <<: *php
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    env_file:
      - ./staging/staging.env
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./staging/staging.env
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql:
  redis:
  minio:
  api-storage:
  caddy-data:
  caddy-config:
